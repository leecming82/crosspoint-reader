[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = 1.3.0

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/check_cjk_ui_font.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://open-x4-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://open-x4-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://open-x4-sdk/libs/display/EInkDisplay
  SDCardManager=symlink://open-x4-sdk/libs/hardware/SDCardManager
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds


[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

[env:murphy_m4]
extends = base
board = esp32-s3-devkitc1-n16r8
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions_murphy_m4.csv
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_BOARD_MURPHY_M4=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-murphy-m4\"
  -DARDUINO_LOOP_STACK_SIZE=32768
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DBOARD_HAS_PSRAM
  -DCROSSPOINT_TTF_READER_DIRECT_FREETYPE=1
extra_scripts =
  ${base.extra_scripts}
lib_deps =
  ${base.lib_deps}
  FreeTypeStandalone=symlink://lib/FreeTypeStandalone

[env:hz52]
extends = base
board = esp32-s3-devkitc1-n16r8
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions_hz52.csv
; Rebuild the Arduino IDF libs with a 64-byte data cache line. epdiy's LCD driver
; (lcd_driver.c: check_cache_configuration) halves the pixel clock from 22 MHz to 11 MHz
; when CONFIG_ESP32S3_DATA_CACHE_LINE_SIZE < 64, because PSRAM DMA cannot stay coherent at
; full rate on a 32-byte line. E-ink waveforms are time-calibrated, so at half the clock
; every phase is applied for twice its designed duration. Stock HZ5.2 firmware runs 22 MHz.
; The quoted line is deliberate: platformio.ini's parser drops bare '#' lines as comments,
; and the builder strips the quotes again (espidf.py: write_sdkconfig_file).
; Switching between this env and one without custom_sdkconfig reinstalls the Arduino
; framework package, so alternating hz52/murphy_m4 builds pays a one-off rebuild each way.
custom_sdkconfig =
  '# CONFIG_ESP32S3_DATA_CACHE_LINE_32B is not set'
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
  CONFIG_ESP32S3_DATA_CACHE_LINE_SIZE=64
  ; Redundant (the Arduino sdkconfig template already sets it) but load-bearing: pioarduino
  ; greps this option's raw text for "PSRAM"/"CONFIG_SPIRAM=y" and, finding neither, appends
  ; -mdisable-hardware-atomics to build_unflags (arduino.py: has_psram_config). The ESP32-S3
  ; cannot do hardware atomics against PSRAM addresses, so dropping that flag would silently
  ; miscompile every atomic on this board.
  CONFIG_SPIRAM=y
; esp_diagnostics only defines __wrap_log_printf under CONFIG_LIB_BUILDER_COMPILE, a symbol
; that exists solely in Espressif's esp32-arduino-lib-builder and has no Kconfig entry here,
; so kconfig drops it from a from-source build. The matching -Wl,--wrap=log_printf lives in
; the prebuilt flags/ld_flags, which the rebuild does not regenerate (espidf.py: idf_lib_copy
; copies archives and sdkconfig.h, not flags/), leaving every log call pointing at a wrapper
; nothing defines. The wrapper is only an ESP Insights capture hook that forwards to
; __real_log_printf, so unwrapping is behaviour-preserving here.
build_unflags =
  ${base.build_unflags}
  -Wl,--wrap=log_printf
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_BOARD_HZ52=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-hz52\"
  -DARDUINO_LOOP_STACK_SIZE=32768
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DBOARD_HAS_PSRAM
  -DCROSSPOINT_TTF_READER_DIRECT_FREETYPE=1
extra_scripts =
  ${base.extra_scripts}
  ; Only needed because custom_sdkconfig above switches this env to a from-source
  ; Arduino build; see the script's docstring.
  post:scripts/embed_idf_data_files.py
lib_deps =
  ${base.lib_deps}
  FreeTypeStandalone=symlink://lib/FreeTypeStandalone
  ; epdiy is LGPL-3.0 (CrossPoint itself is MIT). Release artifacts must carry an LGPL
  ; notice and keep source/relink availability. Pinned to a commit for reproducibility.
  epdiy=https://github.com/vroland/epdiy.git

[env:murphy_m4_ttf_probe]
extends = base
board = esp32-s3-devkitc1-n16r8
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions_murphy_m4.csv
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_BOARD_MURPHY_M4=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-murphy-m4-ttf-probe\"
  -DARDUINO_LOOP_STACK_SIZE=32768
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DBOARD_HAS_PSRAM
  -DCROSSPOINT_TTF_PROBE=1
  -DCROSSPOINT_TTF_PROBE_DIRECT_FREETYPE=1
build_src_filter =
  +<ttf_probe_main.cpp>
  +<platform/skip_efuse_blk_check.c>
lib_deps =
  BatteryMonitor=symlink://open-x4-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://open-x4-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://open-x4-sdk/libs/display/EInkDisplay
  SDCardManager=symlink://open-x4-sdk/libs/hardware/SDCardManager
  FreeTypeStandalone=symlink://lib/FreeTypeStandalone
